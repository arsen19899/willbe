# =============================================================================
#  CallQA — настройки анализа звонков
#  Всё, что нужно менять под свой бизнес, лежит в разделах products / checks /
#  filters. Остальное можно не трогать.
# =============================================================================
version: 1

# --- Распознавание речи --------------------------------------------------- #
asr:
  engine: faster-whisper
  model: large-v3          # tiny | base | small | medium | large-v3
                           # нет видеокарты -> ставьте small или medium
  device: auto             # auto | cuda | cpu
  compute_type: auto       # auto | float16 | int8_float16 | int8
  language: ru
  beam_size: 5
  vad_filter: true         # вырезать тишину перед распознаванием
  word_timestamps: true    # нужно для перебиваний и таймкодов цитат
  initial_prompt: ""       # подсказка со специфичной лексикой, например названия товаров
  cpu_threads: 0
  download_root: ""

# --- Кто оператор, кто клиент --------------------------------------------- #
speakers:
  mode: auto               # auto | stereo | diarize | single
  left: operator           # какая дорожка чья в стереозаписи
  right: client
  autodetect_roles: true   # перепроверить роли по репликам и при необходимости поменять местами
  dual_mono_corr: 0.98     # если каналы почти идентичны — файл считается моно
  operator_markers:
    - "меня зовут"
    - "чем могу помочь"
    - "чем могу быть полезен"
    - "компания"
    - "оставайтесь на линии"
    - "оформляю заявку"
    - "уточню информацию"
    - "спасибо за обращение"
    - "хорошего дня"
  client_markers:
    - "я хотел бы"
    - "а сколько стоит"
    - "мне нужно"
    - "подскажите пожалуйста"
    - "у меня вопрос"
  diarization_model: pyannote/speaker-diarization-3.1
  hf_token: ""             # токен huggingface, нужен только для моно-записей
  num_speakers: 2

# --- Поиск ключевых слов и фраз ------------------------------------------- #
matching:
  lemmatize: true          # "предложил бы гарантию" найдётся по "предложить гарантия"
  yo_to_e: true
  fuzzy_threshold: 88      # 0 = только точный поиск; 85-92 — разумный коридор
  fuzzy_min_len: 8
  max_gap_words: 2         # допустимые вставки внутри фразы ("добрый, эээ, день")

# --- Пороги метрик диалога ------------------------------------------------- #
metrics:
  interruption_overlap_sec: 0.6
  interruption_min_words: 2
  interruption_ignore_backchannel: true
  backchannel_words:
    - "ага"
    - "угу"
    - "да"
    - "да-да"
    - "конечно"
    - "понятно"
    - "хорошо"
    - "ясно"
    - "так"
  long_pause_sec: 3.0
  monologue_sec: 45.0
  fast_speech_wpm: 180.0
  slow_speech_wpm: 90.0

# --- Смысловая оценка моделью --------------------------------------------- #
llm:
  enabled: true
  provider: anthropic      # anthropic | openai | none
  model: claude-sonnet-5   # дешевле и точнее: claude-haiku-4-5 (примерно вдвое дешевле)
  api_key: ""              # оставьте пустым, ключ берётся из переменной окружения
  api_key_env: ANTHROPIC_API_KEY
  base_url: ""             # для openai-совместимых шлюзов, напр. http://localhost:11434/v1
  max_tokens: 4000
  temperature: 0.0
  timeout_sec: 120

# --- Фильтры --------------------------------------------------------------- #
filters:
  min_duration_sec: 10       # короче — в отчёт с пометкой «отфильтрован»
  max_duration_sec: 7200
  min_words: 10
  skip_if_silence_ratio_above: 0.97
  file_name_include: []      # ["re:^out_", "менеджер_иванов"] — пусто = брать все
  file_name_exclude: ["re:(?i)test", "re:(?i)demo"]
  stop_phrases:              # то, что оператор говорить не должен
    - "я не знаю"
    - "это не моя работа"
    - "ничем не могу помочь"
    - "перезвоните потом"
    - "не морочьте голову"
  profanity: []              # свой список нежелательной лексики

# --- Куда складывать результат --------------------------------------------- #
output:
  dir: reports
  formats: [xlsx, csv, json]
  save_transcript: true
  transcript_in_report: true
  evidence_chars: 180

# =============================================================================
#  ТОВАРЫ И УСЛУГИ, которые оператор обязан предложить
#  name    — как называть в отчёте
#  aliases — как это может прозвучать в живой речи
#  required — обязателен ли к предложению в каждом звонке
# =============================================================================
products:
  - name: Расширенная гарантия
    aliases:
      - расширенная гарантия
      - дополнительная гарантия
      - продление гарантии
      - гарантия на два года
      - гарантия на три года
    required: true
    group: Допродажа

  - name: Страховка
    aliases:
      - страховка
      - страхование
      - застраховать
      - полис
    required: false
    group: Допродажа

  - name: Доставка
    aliases:
      - доставка
      - доставим
      - привезём
      - привезем
      - курьер
    required: true
    group: Сервис

  - name: Установка и настройка
    aliases:
      - установка
      - настройка
      - подключение специалистом
      - мастер приедет
    required: false
    group: Сервис

  - name: Программа лояльности
    aliases:
      - бонусная карта
      - карта лояльности
      - накопительные баллы
      - программа лояльности
    required: false
    group: Лояльность

# =============================================================================
#  ЧЕК-ЛИСТ. Каждый пункт даёт колонку «было / не было» в отчёте.
#
#  type:     keyword  — поиск фраз с учётом морфологии
#            regex    — поиск по регулярному выражению
#            sequence — «реплика одного, реакция другого в течение N секунд»
#            metric   — сравнение посчитанной метрики с порогом
#            llm      — смысловая оценка моделью (нужна модель, см. llm)
#            product  — предложение товаров из раздела products
#  speaker:  operator | client | any — в чьей речи искать
#  weight:   вес пункта в итоговом балле
#  required: критичный пункт (провал отдельно подсвечивается в своде)
#  invert:   пункт считается пройденным, если фразы НЕ найдены
#  min_hits: сколько раз должна встретиться фраза (по умолчанию 1)
#
#  Штатный чек-лист ниже целиком построен на правилах и работает БЕЗ языковой
#  модели. Если модель подключена (локальная или через API), можно поменять
#  type на llm у любого пункта — тогда он будет понимать и те формулировки,
#  которых нет в списках. Поле prompt для этого уже заполнено.
#
#  Для type: sequence дополнительно задаются:
#    trigger_speaker  — кто подаёт повод (обычно client)
#    trigger_any_of   — реплики-поводы
#    any_of           — что должно прозвучать в ответе
#    within_sec       — сколько секунд даётся на реакцию
#    if_no_trigger    — pass | fail | na, если повода не было
# =============================================================================
checks:
  # ---------------------------- Открытие ---------------------------------- #
  - id: greeting
    title: Поздоровался
    category: 1. Открытие
    type: keyword
    speaker: operator
    weight: 8
    required: true
    time_to: 40           # только первые 40 секунд разговора
    any_of:
      - здравствуйте
      - добрый день
      - доброе утро
      - добрый вечер
      - приветствую

  - id: self_intro
    title: Представился по имени
    category: 1. Открытие
    type: keyword
    speaker: operator
    weight: 6
    required: true
    time_to: 60
    any_of:
      - меня зовут
      - "re:мо[её] имя"
      - вас приветствует
      - на связи

  - id: company_intro
    title: Назвал компанию
    category: 1. Открытие
    type: keyword
    speaker: operator
    weight: 4
    time_to: 60
    any_of:
      - компания
      - магазин
      - сервисный центр

  - id: ask_client_name
    title: Узнал имя клиента
    category: 1. Открытие
    type: keyword
    speaker: operator
    weight: 5
    any_of:
      - как вас зовут
      - как могу к вам обращаться
      - как я могу к вам обращаться
      - представьтесь пожалуйста

  # ------------------------- Выявление потребности ------------------------- #
  - id: needs_questions
    title: Задал уточняющие вопросы
    category: 2. Потребность
    type: keyword
    speaker: operator
    weight: 8
    any_of:
      - для каких целей
      - что именно вы ищете
      - подскажите пожалуйста
      - какой бюджет
      - что для вас важно
      - как планируете использовать
      - уточните пожалуйста

  # Пункт работает без языковой модели. Если модель подключена, поменяйте
  # type на llm — она поймает и те формулировки, которых нет в списке.
  - id: active_listening
    title: Резюмировал запрос клиента
    category: 2. Потребность
    type: keyword
    speaker: operator
    weight: 6
    any_of:
      - правильно понимаю
      - правильно ли я понял
      - правильно вас понял
      - то есть вы хотите
      - то есть вам нужно
      - если я вас правильно понял
      - давайте уточню
      - итак вам нужно
      - подытожим
    prompt: >
      Оператор своими словами повторил или обобщил запрос клиента
      («правильно понимаю, вам нужно…»), показав, что услышал его?

  # ----------------------------- Презентация ------------------------------- #
  - id: products_offered
    title: Предложил заданные товары
    category: 3. Презентация
    type: product
    speaker: operator
    weight: 12
    required: true

  - id: benefits_language
    title: Говорил о выгодах, а не только о характеристиках
    category: 3. Презентация
    type: keyword
    speaker: operator
    weight: 6
    min_hits: 2          # разовая обмолвка не считается
    any_of:
      - это позволит вам
      - вы сможете
      - для вас это
      - вам будет удобно
      - сэкономит
      - экономия
      - не придётся
      - не придется
      - избавит вас
      - вам не нужно будет
      - плюс для вас
      - выгода
      - зато
    prompt: >
      Оператор объяснял пользу и выгоду для клиента (что это ему даст),
      а не просто перечислял технические характеристики и цены?

  - id: price_named
    title: Озвучил цену
    category: 3. Презентация
    type: regex
    speaker: operator
    weight: 5
    any_of:
      - "re:\\b\\d[\\d\\s]{2,}\\s*(руб|рубл|тысяч|т\\.р|₽)"
      - "re:\\bстоит\\b"
      - "re:\\bцена\\b"

  # -------------------------- Работа с возражениями ------------------------ #
  # Проверка типа sequence: «клиент возразил — оператор ответил в течение N секунд».
  # Работает без языковой модели.
  - id: objection_handling
    title: Отработал возражение
    category: 4. Возражения
    type: sequence
    speaker: operator          # кто должен отреагировать
    weight: 8
    within_sec: 45             # сколько секунд даём на реакцию
    if_no_trigger: pass        # возражений не было — пункт не применяется
    trigger_speaker: client
    trigger_any_of:            # что считаем возражением
      - дорого
      - дороговато
      - дорогова
      - я подумаю
      - надо подумать
      - мне не надо
      - не нужно
      - у конкурентов дешевле
      - в другом месте дешевле
      - меня не устраивает
      - это слишком
      - не уверен
      - сомневаюсь
    any_of:                    # что считаем отработкой
      - понимаю ваши сомнения
      - понимаю вас
      - давайте посчитаем
      - зато
      - при этом
      - обратите внимание
      - смотрите
      - есть вариант
      - могу предложить
      - давайте сравним
      - в эту цену входит
      - если сравнить
    prompt: >
      Клиент высказал сомнение или возражение? Если да — оператор попытался его
      отработать аргументами, а не свернул разговор? Возражений не было — пункт пройден.

  - id: no_argue
    title: Не спорил и не грубил
    category: 4. Возражения
    type: keyword
    speaker: operator
    weight: 8
    required: true
    invert: true
    any_of:
      - вы не правы
      - вы неправы
      - я же сказал
      - вы меня не слушаете
      - это ваши проблемы
      - успокойтесь

  # ------------------------------ Завершение -------------------------------- #
  - id: next_step
    title: Договорился о следующем шаге
    category: 5. Завершение
    type: keyword
    speaker: operator
    weight: 8
    required: true
    any_of:
      - оформляем заказ
      - оформляю заявку
      - я вам перезвоню
      - отправлю вам на почту
      - отправлю в мессенджер
      - ждём вас
      - когда вам удобно
      - записываю вас

  - id: farewell
    title: Попрощался
    category: 5. Завершение
    type: keyword
    speaker: operator
    weight: 4
    any_of:
      - до свидания
      - всего доброго
      - хорошего дня
      - всего хорошего
      - спасибо за обращение
      - до связи

  # ------------------------- Культура разговора ----------------------------- #
  - id: no_interruptions
    title: Не перебивал клиента
    category: 6. Культура
    type: metric
    speaker: operator
    weight: 10
    required: true
    metric: operator_interruptions
    op: "<="
    value: 1

  - id: talk_ratio_ok
    title: Не заговаривал клиента (доля речи оператора ≤ 70%)
    category: 6. Культура
    type: metric
    speaker: operator
    weight: 6
    metric: operator_talk_ratio
    op: "<="
    value: 0.70

  - id: no_long_silence
    title: Без затяжных пауз
    category: 6. Культура
    type: metric
    speaker: any
    weight: 4
    metric: long_pauses
    op: "<="
    value: 3

  - id: no_stop_phrases
    title: Без стоп-фраз
    category: 6. Культура
    type: metric
    speaker: operator
    weight: 8
    required: true
    metric: stop_phrase_hits
    op: "=="
    value: 0

  - id: politeness
    title: Вежливый тон
    category: 6. Культура
    type: keyword
    speaker: operator
    weight: 6
    min_hits: 3          # вежливость — это не один «пожалуйста» за весь разговор
    any_of:
      - пожалуйста
      - спасибо
      - будьте добры
      - благодарю
      - конечно
      - разумеется
      - хорошо
      - всего доброго
      - рад помочь
    prompt: >
      Оператор на протяжении всего разговора сохранял вежливый и доброжелательный тон,
      не раздражался, не отвечал односложно и безучастно?

  - id: answered_client_question
    title: Ответил на вопрос клиента
    category: 6. Культура
    type: sequence
    speaker: operator
    weight: 6
    within_sec: 30
    if_no_trigger: pass
    trigger_speaker: client
    trigger_any_of:
      # вопросительные обороты клиента; знаки препинания в поиске не участвуют,
      # поэтому ловим по началу вопроса
      - "re:\\bа (что|как|сколько|когда|где|какой|какая|какие|можно|есть|нужно)\\b"
      - "re:\\b(подскажите|скажите|расскажите)\\b"
      - "re:\\b(можно|нужно|есть) ли\\b"
      - "re:\\bсколько (стоит|это|будет)\\b"
      - "re:\\bчто (там|по|насчёт|насчет)\\b"
      - а что если
    any_of:
      - "re:\\bда\\b"
      - "re:\\bнет\\b"
      - конечно
      - сейчас уточню
      - сейчас посмотрю
      - стоит
      - есть
      - можно
      - к сожалению
